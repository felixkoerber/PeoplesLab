---
layout: default
---

<section >

	<div class="wrap">

		<h1>{{ page.title }}</h1>
		<p>{{ page.subtitle }}</p>

	</div>

</section>

{% if page.featured_image %}
<section class="single-featured">

	<div class="wrap">
		<figure class="single-featured__media">
			<img src="{{ page.featured_image | relative_url }}" alt="{{ page.title }} featured image" />
		</figure>
	</div>

</section>
{% endif %}

{{ page.content }}
