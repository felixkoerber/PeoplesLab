---
layout: default
title: Team
subtitle: Meet the Members
permalink: /team
---

{% assign team_members = site.team | sort: 'name' %}

<section class="intro">

  <div class="wrap">

    <h1>{{ page.title }}</h1>
    <p>{{ page.subtitle }}</p>

  </div>

</section>

<section class="portfolio">

  <div class="content-wrap portfolio-wrap">

    {% for member in team_members %}

    <div class="portfolio-item">

      <a class="portfolio-item__link" href="{{ member.url | relative_url }}">

        <div class="portfolio-item__image">
          <img src="{{ member.featured_image | default: '/images/social.jpg' | relative_url }}" alt="{{ member.name | default: member.title }}">
        </div>

        <div class="portfolio-item__content">
          <div class="portfolio-item__info">
            <h2 class="portfolio-item__title">{{ member.name | default: member.title }}</h2>
            <p class="portfolio-item__subtitle">{{ member.research_focus }}</p>
          </div>
        </div>

      </a>

    </div>

    {% endfor %}

  </div>

</section>
